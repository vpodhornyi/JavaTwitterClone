version: "3.9"

services:
  twitter-frontend:
    image: node:22.15.0
    container_name: twitter-frontend
    working_dir: /app
    volumes:
      - ./client:/app
    command: sh -c "npm install && npm run build && npx serve -s build -l 8081"
    ports:
      - "8081:8081"
    networks:
      - proxy
      - twitter-net

  twitter-rabbit:
    image: pcloud/rabbitmq-stomp:latest
    container_name: twitter-rabbit
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
      - "61613:61613"
    volumes:
      - twitter-rabbit-data:/var/lib/rabbitmq/mnesia
    networks:
      - twitter-net

  twitter-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: twitter-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - twitter-rabbit
    networks:
      - twitter-net
      - proxy
      - postgres_network

networks:
  twitter-net:
  proxy:
    external: true
  postgres_network:
    external: true
    name: postgres_network

volumes:
  twitter-rabbit-data:
    external: false