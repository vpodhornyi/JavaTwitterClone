# =================================================================
# GLOBAL CONFIGURATION (Applies to ALL Profiles unless overridden)
# =================================================================

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false
  # servlet:
  #   context-path: /api
logging:
  level:
    #    error: true
    root:
    com:
    org:
#    file: logs.log

spring:
  #  config:
  #    import: .env
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME}


  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}        # 5672
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}

  websocket:
    path: ${WEBSOCKET_PATH:/ws}
    port: ${WEBSOCKET_PORT}         # 61613
    clientUser: ${WEBSOCKET_CLIENT_USER}
    clientPassword: ${WEBSOCKET_CLIENT_PASSWORD}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  # empty mail config
  #   mail:
  #    host: ${MAIL_HOST:localhost}
  #    port: ${MAIL_PORT:25}
  #    username: ${MAIL_USERNAME:}
  #    password: ${MAIL_PASSWORD:}
  #    properties:
  #      mail:
  #        smtp:
  #          auth: false
  #          starttls:
  #            enable: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 10000000  #10M
      max-request-size: 10000000

app:
  mail:
    from: ${MAIL_FROM}

api:
  version: ${API_VERSION}

jwt:
  secret:
    access: ${JWT_SECRET_ACCESS}
    refresh: ${JWT_SECRET_REFRESH}
  access:
    leave:
      minutes: ${JWT_ACCESS_LEAVE_MINUTES}
  refresh:
    leave:
      days: ${JWT_REFRESH_LEAVE_DAYS}
  authorization:
    user:
      field: userTag

cloudinary:
  cloud_name: ${CLOUDINARY_NAME}
  api_key: ${CLOUDINARY_API_KEY}
  api_secret: ${CLOUDINARY_API_SECRET}

# =================================================================
# PROFILE: DEV (dev server development)
# =================================================================
---
spring:
  config:
    activate:
      on-profile: dev
    import: optional:secrets.properties[.properties]

  sql:
    init:
      mode: always

# =================================================================
# PROFILE: LOCAL (Local development)
# =================================================================
---
spring:
  config:
    activate:
      on-profile: local
    import: optional:secrets.properties[.properties]

  sql:
    init:
      mode: always

  rabbitmq:
    host: localhost

  jpa:
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
      dialect: ${SPRING_JPA_DIALECT}
      generate_statistics: false
    generate-ddl: true
    hibernate:
      ddl-auto: update
    show-sql: false

# =================================================================
# PROFILE: PROD (Docker / Server)
# =================================================================
---
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: ${SPRING_JPA_DIALECT}
    open-in-view: false

  sql:
    init:
      mode: never
